name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        shell:
          - powershell
          - pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify toolkit
        shell: ${{ matrix.shell }}
        run: ./tests/Verify.ps1

      - name: Audit runtime dependencies
        run: npm audit --omit=dev
