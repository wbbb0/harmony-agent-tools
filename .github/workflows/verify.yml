name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Verify.ps1

      - name: Verify with PowerShell 7
        shell: pwsh
        run: ./tests/Verify.ps1

      - name: Audit runtime dependencies
        run: npm audit --omit=dev
